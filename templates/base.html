<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

    <title>{% block title %}{% endblock %}</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-md navbar-light bg-light">
        <a class="navbar-brand" href="{{ url_for('index')}}">Demo App</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
            <li class="nav-item active">
                <a class="nav-link" href="#">About</a>
            </li>
            </ul>
        </div>
    </nav>
    <div class="container">
        {% block content %} {% endblock %}
    </div>
    <div class="container">
        <form method="POST" action="/formcred">
          <div class="mb-3 row">
            <div class="col">
              <div class="mb-3">
                <label for="loginName" class="form-label">Login Name</label>
                <input type="text" class="form-control" id="loginName" name="loginName" value="{% block login %}{% endblock %}">
              </div>
            </div>
          </div>
            <div class="mb-3 row">
              <div class="col">
                <label for="userID" class="visually-hidden">User ID</label>
                <input type="text" class="form-control" id="userID" value="{% block userid %} {% endblock %}" readonly>
              </div>
            </div>
            <div class="mb-3 row">
              <div class="col">
                <label for="formCred" class="visually-hidden">FORMCRED</label>
                <input type="text" class="form-control" id="formCred" value="{% block formcred %} {% endblock %}" readonly>
              </div>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="env" id="inlineRadio1" value="sit" {% block sitchecked %}{% endblock %}>
              <label class="form-check-label" for="inlineRadio1">SIT</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="env" id="inlineRadio2" value="uat" {% block uatchecked %}{% endblock %}>
              <label class="form-check-label" for="inlineRadio2">UAT</label>
            </div>
            <div class="mb-3 row">
                 <div class="col">
                    <button type="submit" class="btn btn-primary mb-3">Get FORMCRED</button>
                 </div>
            </div>
        </form>
    </div>

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
  </body>
</html>
